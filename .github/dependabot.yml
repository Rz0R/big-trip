version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Major upgrades need a separate code/configuration migration.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      npm-updates:
        applies-to: version-updates
        patterns:
          - '*'
